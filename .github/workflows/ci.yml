name: CI

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test, Build & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint code
        run: npm run lint

      - name: Run unit & regression tests
        run: npm run test:coverage

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Valid domain-shaped dummy key for build validation in CI
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_YnVpbGQtdmFsaWRhdGlvbi5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: dummy_build_validation_secret_key_ci

      - name: Scan build output and source for secrets
        run: npm run scan:secrets

      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true
